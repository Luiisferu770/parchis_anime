<title>Parqués Anime</title>
<!-- ICONO DE LA PESTAÑA: guarda tu PNG como favicon.png (en la carpeta de imágenes) (cuadrado, ej. 128x128). Si no existe, se usa un dado 🎲 -->
<link id="fav" rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#1b1030;color:#fff;font-family:system-ui,Arial,sans-serif}
#app{display:flex;gap:14px;height:100vh;padding:10px}#bd{flex:1;min-width:0;position:relative}#bd svg{width:100%;height:100%}
#pn{width:290px;display:flex;flex-direction:column;gap:12px;background:#2b1a4a;border-radius:14px;padding:14px}
h1{margin:0;font-size:20px}.hd{display:flex;justify-content:space-between;align-items:center}
#home{font-size:22px;background:#ffffff18;border:0;border-radius:10px;padding:6px 10px;cursor:pointer}#home:hover{background:#ffffff33}
#turno{display:flex;align-items:center;gap:8px;flex-wrap:wrap}#turno small{opacity:.7;width:100%}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #fff}
button.big{padding:12px;font-size:16px;font-weight:700;border:0;border-radius:10px;background:#ffd400;color:#222;cursor:pointer}button.big:disabled{opacity:.4;cursor:default}
#msg{min-height:40px;font-size:14px}#extra{font-size:13px;color:#ffd400;min-height:16px}
#log{font-size:12px;opacity:.85;overflow:auto;flex:1}#log div{padding:2px 0;border-bottom:1px solid #ffffff22}
/* dados */
#dice{--ds:clamp(40px,6.4vmin,72px);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--ds)*.4);z-index:3;cursor:pointer;filter:drop-shadow(0 8px 6px #0007)}
.dd{width:var(--ds);height:var(--ds);border-radius:20%;border:3px solid var(--c,#fff);background:linear-gradient(145deg,#fff 0%,#e9e9f5 55%,#c9c9dc 100%);box-shadow:inset 0 -5px 0 #b4b4c8,inset 0 2px 4px #fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;transition:opacity .25s,filter .25s}
.dd i{border-radius:50%;margin:8%;visibility:hidden;background:radial-gradient(circle at 35% 30%,#555,#111)}.dd i.on{visibility:visible}
.dd.used{opacity:.4;filter:grayscale(.7)}
.dd.rolling{animation:tumble .75s cubic-bezier(.3,.7,.4,1)}
@keyframes tumble{0%{transform:translateY(-34px) rotate(0) scale(1.25)}30%{transform:translateY(0) rotate(260deg) scale(1)}50%{transform:translateY(-16px) rotate(430deg) scale(1.1)}75%{transform:translateY(0) rotate(620deg) scale(1)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
/* fichas */
.hl{display:none}.tk.mv{cursor:pointer;animation:hop 1s ease-in-out infinite}.tk.mv .hl{display:block}
@keyframes hop{50%{transform:translateY(-4px)}}
/* tooltip con la imagen grande de la ficha */
#tip{position:absolute;display:none;z-index:7;pointer-events:none;background:#1b1030ee;border:2px solid var(--c,#fff);border-radius:14px;padding:8px;text-align:center;box-shadow:0 10px 26px #000a;transform:translate(-50%,-112%);font-size:12px;line-height:1.3}
#tip.below{transform:translate(-50%,18%)}
#tip .im{width:128px;height:128px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#4a3a66,#120a20);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
#tip .im img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 3px 4px #000)}
#tip .im b{font-size:56px}
/* ventana flotante de opciones */
#pop{position:absolute;display:none;gap:8px;padding:9px 10px;background:#fff;color:#222;border-radius:16px;box-shadow:0 10px 28px #000a;transform:translate(-50%,-128%);z-index:6}
#pop::after{content:'';position:absolute;left:50%;bottom:-7px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:3px}
#pop.below{transform:translate(-50%,46%)}#pop.below::after{bottom:auto;top:-7px}
#pop button{min-width:62px;padding:6px 8px;border:0;border-radius:12px;background:#efeafc;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;z-index:1}
#pop button b{font-size:24px;line-height:1}#pop button small{font-size:11px;color:#555}#pop button:hover{background:#ffd400}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:9}
.card{background:#2b1a4a;border-radius:16px;padding:22px;max-width:560px;width:92%;display:flex;flex-direction:column;gap:10px;max-height:94vh;overflow:auto}
.row{display:flex;gap:8px}.row input,.row select,#np{padding:9px;border-radius:8px;border:0;font-size:14px}.row input{flex:1;min-width:0}#err{color:#ff8a8a;min-height:18px}
@media(max-width:800px){#app{flex-direction:column;height:auto}#bd{height:92vw}#pn{width:auto}}
</style></head><body>

/* ===== MOTOR: parchís, 2 dados, sentido contrario a las manecillas ===== */
const N=136, LL=132, MET=139; // 136 casillas; ruta: 132 del circuito (salida → punta propia), 7 del pasillo y la meta
const S=hi=>(5+17*hi)%N;                    // casilla de salida de cada casa
const isSafe=idx=>[0,5,12].includes(idx%17); // salidas y seguros
const cell=p=>p.k<LL?'c'+((S(p.hi)+p.k)%N):'h'+p.hi+'.'+(p.k-LL);
const at=(g,key)=>g.pc.filter(q=>q.st==='juego'&&cell(q)===key);
const lg=(g,s)=>{g.log.push(s);if(g.log.length>40)g.log.shift();};
const who=g=>g.pl[g.turn].name;
const lastIn=o=>o.reduce((s,c)=>c.t>s.t?c:s);

function newGame(sel){
  const g={pl:sel,pc:[],turn:0,dice:[0,0],used:[true,true],dbl:false,dbls:0,bv:0,bq:[],last:null,clock:0,noBar:false,phase:'roll',log:[],win:null};
  sel.forEach((p,pi)=>{for(let n=1;n<=4;n++)g.pc.push({p:pi,hi:p.hi,n,st:'casa',k:-1,t:0});});
  lg(g,'Empieza '+sel[0].name+'. Para salir necesitas un 5 (o que los dos dados sumen 5).');return g;
}
function ev(g,p,v,bonus){
  if(p.st==='casa'){
    if(bonus||v!==5)return null;
    const o=at(g,'c'+S(p.hi));
    if(o.length<2)return {t:'sal',cap:[]};            // con una sola ficha en la salida conviven
    if(o.every(q=>q.p===p.p))return null;               // dos propias: no cabe otra
    return {t:'sal',cap:[lastIn(o.filter(q=>q.p!==p.p))]}; // casilla llena: se come a la rival (la última en llegar)
  }
  if(p.st!=='juego')return null;
  const nk=p.k+v; if(nk>MET)return null;                // meta: número exacto
  for(let j=p.k+1;j<=nk&&j<LL;j++){if(at(g,cell({hi:p.hi,k:j})).length>=2)return null;} // barrera: no se salta ni se cae en ella
  let cap=[];
  if(nk<LL){const key=cell({hi:p.hi,k:nk}),o=at(g,key);
    if(g.noBar&&o.length===1&&o[0].p===p.p)return null; // en esta tirada ya se rompió una barrera: no se vuelve a formar
    if(o.length===1&&o[0].p!==p.p&&!isSafe(+key.slice(1)))cap=[o[0]];}
  return {t:'mov',nk,cap};
}
function legalD(g){
  const L=[],seen=new Set(),mine=g.pc.filter(p=>p.p===g.turn);
  [0,1].forEach(d=>{
    if(g.used[d])return;const v=g.dice[d];if(seen.has(v))return;seen.add(v);
    mine.forEach(p=>{const m=ev(g,p,v,false);if(m)L.push({d,v,p,m});});
  });
  if(!g.used[0]&&!g.used[1]&&g.dice[0]+g.dice[1]===5) // los dos dados suman 5: también se sale
    mine.forEach(p=>{const m=ev(g,p,5,false);if(m)L.push({d:-2,v:5,p,m,sum:true});});
  const ex=L.filter(x=>x.m.t==='sal');if(ex.length)return ex;                     // salir es obligatorio
  if(g.dbl){const bl=L.filter(x=>x.p.st==='juego'&&x.p.k<LL&&at(g,cell(x.p)).length===2);if(bl.length)return bl;} // con un par se rompe la barrera
  return L;
}
function legalB(g,v){const L=[];g.pc.forEach(p=>{if(p.p!==g.turn)return;const m=ev(g,p,v,true);if(m)L.push({d:-1,v,p,m});});return L;}
const legal=g=>g.phase==='bonus'?legalB(g,g.bv):legalD(g);
const jail=(g,q)=>{q.st='casa';q.k=-1;};
function apply(g,x){
  const {p,m}=x,n=who(g);
  const wasBar=p.st==='juego'&&p.k<LL&&(()=>{const o=at(g,cell(p));return o.length===2&&o.every(q=>q.p===p.p);})();
  if(x.d===-2)g.used=[true,true];else if(x.d>=0)g.used[x.d]=true;
  if(m.t==='sal'){p.st='juego';p.k=0;p.t=++g.clock;lg(g,n+' saca una ficha.');}
  else{p.k=m.nk;p.t=++g.clock;if(p.k===MET){p.st='meta';g.bq.push(10);lg(g,n+' mete una ficha en la meta. ¡Premio de 10!');}}
  if(m.cap.length){m.cap.forEach(q=>jail(g,q));g.bq.push(20);lg(g,n+' se come una ficha de '+g.pl[m.cap[0].p].name+'. ¡Premio de 20!');}
  if(wasBar)g.noBar=true;
  g.last=p;
  if(g.pc.every(q=>q.p!==g.turn||q.st==='meta')){g.win=g.turn;g.phase='over';lg(g,'¡'+n+' ganó la partida!');return;}
  settle(g);
}
function settle(g){
  if(g.win!==null)return g.phase='over';
  while(g.bq.length){const b=g.bq.shift();
    if(legalB(g,b).length){g.bv=b;g.phase='bonus';return g.phase;}
    lg(g,'Premio de '+b+' perdido: ninguna ficha puede avanzar tanto.');}
  if(!g.used[0]||!g.used[1]){if(legalD(g).length){g.phase='move';return g.phase;}g.used=[true,true];}
  if(g.dbl){g.dbl=false;g.phase='roll';lg(g,who(g)+' sacó doble: tira otra vez.');return g.phase;}
  return nextTurn(g);
}
function nextTurn(g){g.turn=(g.turn+1)%g.pl.length;g.dbls=0;g.dbl=false;g.noBar=false;g.last=null;g.bq=[];g.used=[true,true];g.phase='roll';lg(g,'Turno de '+who(g)+'.');return g.phase;}
function roll(g,r=Math.random){
  const a=1+Math.floor(r()*6),b=1+Math.floor(r()*6),n=who(g);
  g.dice=[a,b];g.used=[false,false];g.dbl=a===b;g.noBar=false;
  lg(g,n+' sacó '+a+' y '+b+(g.dbl?' (doble)':'')+'.');
  if(g.dbl&&++g.dbls>=3){
    const q=g.last;
    if(q&&q.st==='juego'&&q.k<LL){jail(g,q);lg(g,'Tres dobles seguidos: la última ficha que movió '+n+' vuelve a casa.');}
    else lg(g,'Tres dobles seguidos: '+n+' pierde el turno.');
    nextTurn(g);return;}
  const play=g.pc.some(q=>q.p===g.turn&&q.st==='juego');
  if(!play&&!legalD(g).length){ // sin fichas afuera y sin poder salir: un solo intento
    g.used=[true,true];
    if(g.dbl){g.dbl=false;g.phase='roll';lg(g,n+' no pudo salir, pero sacó doble: tira otra vez.');return;}
    lg(g,n+' no sacó 5. Pasa el turno.');nextTurn(g);return;}
  g.phase=legalD(g).length?'move':'stuck';
  if(g.phase==='stuck')lg(g,n+' no puede mover.');
}
function skip(g){if(g.phase==='stuck')settle(g);}
if(typeof module!=='undefined')module.exports={newGame,roll,legal,legalD,apply,skip,cell,at,ev,N,LL,MET,S};

  /* efectos de las fichas: sombra, contorno claro del icono, textura y degradado por casa */
  const df=el('defs',{},svg);
  const f1=el('filter',{id:'fBlur',x:'-40%',y:'-40%',width:'180%',height:'180%'},df);el('feGaussianBlur',{stdDeviation:2.4},f1);
  const f2=el('filter',{id:'fIcon',x:'-30%',y:'-30%',width:'170%',height:'170%'},df);
  el('feMorphology',{in:'SourceAlpha',operator:'dilate',radius:1.4,result:'dil'},f2);
  el('feFlood',{'flood-color':'#fff','flood-opacity':.95,result:'wh'},f2);
  el('feComposite',{in:'wh',in2:'dil',operator:'in',result:'out'},f2);
  el('feGaussianBlur',{in:'SourceAlpha',stdDeviation:1.6,result:'bl'},f2);
  el('feOffset',{in:'bl',dx:2.5,dy:3.5,result:'of'},f2);
  el('feFlood',{'flood-color':'#000','flood-opacity':.6,result:'bk'},f2);
  el('feComposite',{in:'bk',in2:'of',operator:'in',result:'sh'},f2);
  const mg=el('feMerge',{},f2);['sh','out','SourceGraphic'].forEach(i=>el('feMergeNode',{in:i},mg));
  const pt=el('pattern',{id:'tex',width:5,height:5,patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'},df);el('rect',{width:5,height:1.6,fill:'#fff','fill-opacity':.1},pt);
  const gw=el('radialGradient',{id:'gw',cx:.35,cy:.3,r:.95},df);[[0,'#ffffff'],[.7,'#f2f2f2'],[1,'#c9c9d2']].forEach(s=>el('stop',{offset:s[0],'stop-color':s[1]},gw));
  D.houses.forEach((h,i)=>{const gr=el('radialGradient',{id:'gb'+i,cx:.35,cy:.3,r:.95},df);
    [[0,tone(h.color,-.1,.12)],[.6,tone(h.color,-.22,.12)],[1,tone(h.color,-.34,.12)]].forEach(s=>el('stop',{offset:s[0],'stop-color':s[1]},gr));});
  el('g',{id:'tk'},svg);
}
function pos(p){
  const h=D.houses[p.hi];
  if(p.st==='casa'){const s=SL[p.n-1];return [h.hx+s[0],h.hy+s[1]];}
  if(p.st==='meta'){const a=D.arms[p.hi]*Math.PI/180,o=(p.n-2.5)*34;return [CX+95*Math.cos(a)-o*Math.sin(a),CY-95*Math.sin(a)-o*Math.cos(a)];}
  const k=cell(p),c=k[0]==='c'?D.cells[+k.slice(1)]:D.home[p.hi][+k.split('.')[1]];return [c[0],c[1]];
}
const active=()=>!busy&&g.phase!=='over'&&(g.phase==='move'||g.phase==='bonus');
const mvOf=p=>active()?legal(g).filter(x=>x.p===p):[];
const hslOf=c=>{const [r,g,b]=rgb(c).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];};
const hexOf=(h,s,l)=>{const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);};
/* color de la ficha: el de la casa pero más oscuro y saturado, para que no se confunda con la casilla */
const tone=(c,dl,ds)=>{const [h,s,l]=hslOf(c);return hexOf(h,Math.min(1,Math.max(0,s+ds)),Math.min(.9,Math.max(.1,l+dl)));};
function token(parent,p,x,y,r,mv){
  const h=D.houses[p.hi],ic=icon(p),e=el('g',{class:'tk'+(mv?' mv':'')},parent),ri=r-r*.27;
  el('circle',{cx:x,cy:y,r:r+10,fill:'none','pointer-events':'all'},e); // zona táctil más grande
  el('ellipse',{cx:x+1,cy:y+r*.86,rx:r*.95,ry:r*.4,fill:'#000','fill-opacity':.5,filter:'url(#fBlur)'},e);
  el('circle',{cx:x,cy:y+r*.16,r,fill:'#2a2233'},e);                                   // canto (grosor)
  el('circle',{class:'top',cx:x,cy:y,r,fill:'url(#gw)',stroke:'#1a1422','stroke-width':1.8},e); // borde blanco grande
  el('circle',{cx:x,cy:y,r:ri,fill:'url(#gb'+p.hi+')',stroke:'#00000055','stroke-width':1.2},e); // interior de color
  el('circle',{cx:x,cy:y,r:ri-1,fill:'url(#tex)','pointer-events':'none'},e);          // textura
  el('ellipse',{cx:x-ri*.3,cy:y-ri*.5,rx:ri*.5,ry:ri*.2,fill:'#fff','fill-opacity':.25,transform:'rotate(-25 '+x+' '+y+')','pointer-events':'none'},e); // brillo
  if(ic){const s=ri*2.1;el('image',{href:IMG+ic.u+'.png',x:x-s/2,y:y-s/2-ri*.08,width:s,height:s,filter:'url(#fIcon)','pointer-events':'none',preserveAspectRatio:'xMidYMid meet'},e);}
  else el('text',{x,y:y+ri*.38,'text-anchor':'middle','font-size':ri*1.15,'font-weight':800,fill:'#fff',stroke:'#000','stroke-width':3,'paint-order':'stroke','pointer-events':'none'},e).textContent=p.n;
  if(ic&&!ic.own){el('circle',{cx:x+r*.66,cy:y+r*.66,r:r*.3,fill:'#111',stroke:'#fff','stroke-width':1.5,'pointer-events':'none'},e);el('text',{x:x+r*.66,y:y+r*.66+r*.11,'text-anchor':'middle','font-size':r*.38,'font-weight':800,fill:'#fff','pointer-events':'none'},e).textContent=p.n;}
  el('circle',{class:'hl',cx:x,cy:y,r:r+3.5,fill:'none',stroke:'#ffd400','stroke-width':4.5,'pointer-events':'none'},e); // resalte de ficha movible
  return e;
}
const slotAng=p=>{const k=cell(p);return (k[0]==='c'?D.cells[+k.slice(1)][2]:D.pas[p.hi][0][2])*Math.PI/180;};
function draw(){
  const tk=$('#tk');tk.innerHTML='';
  const mv=active()?legal(g):[],by={};
  g.pc.forEach(p=>{if(p.st==='juego'){const k=cell(p);(by[k]=by[k]||[]).push(p);}});
  const cur=D.houses[g.pl[g.turn].hi];
  if(g.phase!=='over')el('circle',{cx:cur.hx,cy:cur.hy,r:80,fill:'none',stroke:'#ffd400','stroke-width':6,'stroke-dasharray':'10 6','pointer-events':'none'},tk);
  g.pl.forEach(q=>{const h=D.houses[q.hi];el('text',{x:h.hx,y:h.hy-62,'text-anchor':'middle','font-size':20,'font-weight':700,fill:'#fff','paint-order':'stroke',stroke:'#000','stroke-width':5,'pointer-events':'none'},tk).textContent=q.name;});
  const order=[...g.pc].sort((a,b)=>pos(a)[1]-pos(b)[1]);
  order.forEach(p=>{
    let [x,y]=pos(p),r=25*KS(),gp=p.st==='juego'?by[cell(p)]:null;
    if(gp&&gp.length>1){const n=gp.length,a=slotAng(p),off=(gp.indexOf(p)-(n-1)/2)*(n===2?40:26)*KS();x+=Math.cos(a)*off;y+=Math.sin(a)*off;r*=n===2?.76:.6;}
    const e=token(tk,p,x,y,r,mv.some(m=>m.p===p));
    e.onclick=ev=>{ev.stopPropagation();pick(p);};
    e.onmouseenter=()=>showTip(p,x,y);e.onmouseleave=hideTip;
  });
}
/* destino y etiqueta de cada opción */
const dest=(p,x)=>x.m.t==='sal'?0:x.m.nk===MET?'Meta':x.m.nk>=LL?'Pasillo '+(x.m.nk-LL+1):D.cells[(S(p.hi)+x.m.nk)%N][4];
function pvAt(p,x){
  rmPv();const t=x.m.t==='sal'?{st:'juego',hi:p.hi,k:0}:{st:x.m.nk===MET?'meta':'juego',hi:p.hi,k:x.m.nk,n:p.n};
  const [px,py]=pos(t);el('circle',{id:'pv',cx:px,cy:py,r:24,fill:'none',stroke:'#ffd400','stroke-width':5,'stroke-dasharray':'6 4','pointer-events':'none'},$('#tk'));
}
function rmPv(){const o=$('#pv');if(o)o.remove();}
function closePop(){$('#pop').style.display='none';rmPv();}
/* tooltip: imagen grande de la ficha */
let tipT=0;
const KS=()=>Math.min(1.25,Math.max(1,620/($('#bd').clientWidth||800)));
function scr(x,y){const pt=svg.createSVGPoint();pt.x=x;pt.y=y;const s=pt.matrixTransform(svg.getScreenCTM()),br=$('#bd').getBoundingClientRect();return [s.x-br.left,s.y-br.top];}
function showTip(p,x,y,ms){
  if($('#pop').style.display==='flex'||busy)return;
  clearTimeout(tipT);const h=D.houses[p.hi],ic=icon(p),tp=$('#tip'),[sx,sy]=scr(x,y);
  tp.style.setProperty('--c',h.color);tp.className=sy<190?'below':'';
  tp.innerHTML='<div class="im">'+(ic?'<img src="'+IMG+ic.u+'.png">':'<b>'+p.n+'</b>')+'</div><b>'+g.pl[p.p].name+'</b><br>'+h.name+' · ficha '+p.n;
  tp.style.left=sx+'px';tp.style.top=sy+'px';tp.style.display='block';
  if(ms)tipT=setTimeout(hideTip,ms);
}
function hideTip(){$('#tip').style.display='none';}
function openPop(p,opts){
  const [x,y]=pos(p),pt=svg.createSVGPoint();pt.x=x;pt.y=y;
  const s=pt.matrixTransform(svg.getScreenCTM()),br=$('#bd').getBoundingClientRect(),pp=$('#pop');
  pp.innerHTML='';pp.className=(s.y-br.top<110)?'below':'';
  opts.forEach(o=>{
    const b=document.createElement('button'),d=dest(p,o);
    b.innerHTML='<b>'+(o.m.t==='sal'?(o.sum?'3+2':'5'):o.v)+'</b><small>'+(o.m.t==='sal'?'Sacar':'→ '+d)+(o.m.cap.length?' ⚔':'')+'</small>';
    b.onclick=e=>{e.stopPropagation();closePop();apply(g,o);ui();};
    b.onmouseenter=()=>pvAt(p,o);b.onmouseleave=rmPv;pp.appendChild(b);
  });
  pp.style.left=(s.x-br.left)+'px';pp.style.top=(s.y-br.top)+'px';pp.style.display='flex';
}
function pick(p){
  if(!active()){showTip(p,...pos(p),2500);return;}
  closePop();const m=mvOf(p);if(!m.length){showTip(p,...pos(p),2500);return;}
  if(m.length===1){apply(g,m[0]);ui();}else openPop(p,m);
}
/* dados */
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const face=(e,v)=>e.querySelectorAll('i').forEach((i,k)=>i.className=PIPS[v].includes(k)?'on':'');
function spin(vals){
  busy=true;const ds=[$('#d0'),$('#d1')];
  ds.forEach((e,i)=>{e.classList.remove('used');e.style.animationDelay=i*70+'ms';e.classList.add('rolling');});
  const iv=setInterval(()=>ds.forEach(e=>face(e,1+Math.floor(Math.random()*6))),75);
  setTimeout(()=>{clearInterval(iv);ds.forEach((e,i)=>{e.classList.remove('rolling');face(e,vals[i]);});busy=false;ui();},800);
}
function doRoll(){
  if(busy||g.phase==='over')return;
  if(g.phase==='stuck'){skip(g);ui();return;}
  if(g.phase!=='roll')return;
  closePop();roll(g);spin(g.dice.slice());ui();
}
function ui(){
  closePop();hideTip();
  const q=g.pl[g.turn],h=D.houses[q.hi],bo=g.phase==='bonus';
  $('#turno').innerHTML='<span class="dot" style="background:'+h.color+'"></span><b>'+q.name+'</b><small>'+h.name+' · '+h.anime+'</small>';
  $('#dice').style.setProperty('--c',h.color);
  if(!busy)[0,1].forEach(d=>{const e=$('#d'+d);face(e,g.dice[d]||(d?3:4));e.classList.toggle('used',!g.used[d]===false||!g.dice[d]);});
  $('#extra').textContent=bo?'🎁 Premio: mueve una ficha '+g.bv+' casillas':'';
  const rb=$('#roll');rb.disabled=busy||!(g.phase==='roll'||g.phase==='stuck');
  rb.textContent=g.phase==='stuck'?'Sin jugadas · continuar':'Lanzar dados';
  if(g.phase==='over'&&!busy){$('#fin').style.display='flex';$('#finTxt').textContent='🏆 ¡'+g.pl[g.win].name+' ganó con '+h.name+'!';}
  const L=active()?legal(g):[];
  $('#msg').textContent=busy?'Lanzando…':g.phase==='roll'?'Es tu turno, '+q.name+': lanza los dados.'
    :bo?'¡Premio! Toca la ficha resaltada que quieres mover.'
    :g.phase==='move'?(L.some(x=>x.m.t==='sal')?'Sacaste un 5: toca una ficha de tu casa para sacarla.':L.some(x=>x.m.cap.length)?'Puedes comer: toca la ficha resaltada que prefieras.':'Toca la ficha que quieres mover.'):'';
  $('#log').innerHTML=g.log.slice(-8).reverse().map(s=>'<div>'+s+'</div>').join('');
  draw();
}
$('#roll').onclick=doRoll;$('#dice').onclick=doRoll;
document.addEventListener('click',e=>{if(!e.target.closest('#pop'))closePop();});
$('#home').onclick=()=>{if(confirm('¿Reiniciar el juego y volver al inicio?')){closePop();$('#fin').style.display='none';$('#setup').style.display='flex';}};
function rows(){
  const n=+$('#np').value,box=$('#rows');box.innerHTML='';
  for(let i=0;i<n;i++)box.insertAdjacentHTML('beforeend','<div class="row"><input maxlength="14" placeholder="Jugador '+(i+1)+'" id="nm'+i+'"><select id="hs'+i+'">'+D.houses.map((h,k)=>'<option value="'+k+'"'+(k===i?' selected':'')+'>'+h.name+' ('+h.anime+')</option>').join('')+'</select></div>');
}
function start(){
  const n=+$('#np').value,hs=[],pl=[];
  for(let i=0;i<n;i++){const hi=+$('#hs'+i).value;if(hs.includes(hi)){$('#err').textContent='Cada jugador debe escoger una casa distinta.';return;}hs.push(hi);pl.push({name:$('#nm'+i).value.trim()||'Jugador '+(i+1),hi});}
  $('#err').textContent='';pl.sort((a,b)=>a.hi-b.hi);g=newGame(pl);busy=false;$('#setup').style.display='none';ui();
}
$('#np').innerHTML=[2,3,4,5,6,7,8].map(n=>'<option>'+n+'</option>').join('');$('#np').value=4;
$('#np').onchange=rows;$('#go').onclick=start;$('#again').onclick=()=>{$('#fin').style.display='none';$('#setup').style.display='flex';};
addEventListener('resize',()=>{if(g)draw();});
$('#fav').href=IMG+'favicon.png';
chk('favicon').then(()=>{if(!OK.has('favicon'))$('#fav').href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>";});
Promise.all(URLS.map(chk)).then(()=>{prep();[0,1].forEach(d=>{const e=$('#d'+d);e.innerHTML='<i></i>'.repeat(9);face(e,d?3:4);});rows();$('#setup').style.display='flex';});

</script></body></html>
